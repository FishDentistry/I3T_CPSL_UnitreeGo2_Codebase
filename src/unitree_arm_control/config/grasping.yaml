d1_grasp_coordinator:
  ros__parameters:
    semantic_map_topic: /semantic_map
    detections_topic: /grounding_dino/detection_array
    command_topic: /d1_grasp/command
    status_topic: /d1_grasp/status
    pregrasp_pose_topic: /d1_grasp/pregrasp_pose
    grasp_pose_topic: /d1_grasp/grasp_pose
    move_group_action: /move_action
    execute_trajectory_action: /execute_trajectory
    cartesian_path_service: /compute_cartesian_path
    compute_ik_service: /compute_ik
    gripper_service: /d1_arm_controller/set_joint
    joint_angles_topic: /d1_arm_controller/joint_angles
    planning_group: d1_arm
    planning_frame: base_link
    reach_reference_frame: d1_base_link
    tip_link: d1_gripper_tcp
    planner_id: ""

    # Reject uncertain, tentative, stale, or unreachable map entries.
    minimum_confidence: 0.65
    minimum_observations: 3
    maximum_object_age_sec: 20.0
    minimum_reach_m: 0.10
    maximum_reach_m: 0.67
    minimum_target_z_m: -0.10
    maximum_target_z_m: 0.80

    # Aim from the live gripper position toward the object in 3-D, then try
    # yaw alternatives around that direction. The gripper's +Z tool axis
    # points along the approach.
    approach_yaw_offsets_rad: [0.0, 0.5235987756, -0.5235987756, 1.0471975512, -1.0471975512]
    approach_distance_m: 0.11
    # Apply only after measuring the desired tool-frame-to-object offset.
    grasp_center_offset_m: 0.0
    tool_roll_rad: 0.0
    tool_roll_offsets_rad: [0.0, 1.5707963268, -1.5707963268]
    ik_timeout_sec: 0.5
    joint_goal_tolerance_rad: 0.005

    planning_time_sec: 5.0
    planning_attempts: 5
    velocity_scaling: 0.15
    acceleration_scaling: 0.10

    # Recheck the target after the pre-grasp and use a short, slow Cartesian
    # segment for the final approach and retreat.
    fresh_detection_age_sec: 5.0
    reacquire_timeout_sec: 10.0
    reacquire_match_distance_m: 0.25
    maximum_reacquire_correction_m: 0.08
    cartesian_step_m: 0.005
    minimum_cartesian_fraction: 0.95
    cartesian_jump_threshold: 2.0
    cartesian_velocity_scaling: 0.05
    cartesian_acceleration_scaling: 0.05

    # The D1 reports gripper position but not contact force. A grasp is
    # accepted when the command reaches closed, or when feedback stalls after
    # meaningful closure. Set require_grasp_obstruction true to require stall.
    gripper_joint_id: 6
    gripper_open_degrees: 30.0
    gripper_closed_degrees: 0.0
    gripper_tolerance_degrees: 2.0
    minimum_gripper_closure_degrees: 3.0
    gripper_stall_delta_degrees: 0.2
    gripper_stall_confirm_sec: 0.75
    gripper_operation_timeout_sec: 5.0
    require_grasp_obstruction: false
    hold_duration_sec: 3.0
