d1_grasp_coordinator:
  ros__parameters:
    semantic_map_topic: /semantic_map
    command_topic: /d1_grasp/command
    status_topic: /d1_grasp/status
    pregrasp_pose_topic: /d1_grasp/pregrasp_pose
    move_group_action: /move_action
    planning_group: d1_arm
    planning_frame: base_link
    reach_reference_frame: d1_base_link
    tip_link: d1_gripper_center
    planner_id: ""

    # Reject uncertain, tentative, stale, or unreachable map entries.
    minimum_confidence: 0.65
    minimum_observations: 3
    maximum_object_age_sec: 20.0
    minimum_reach_m: 0.10
    maximum_reach_m: 0.67
    minimum_target_z_m: -0.10
    maximum_target_z_m: 0.80

    # Constrain the pre-grasp to the gripper's live orientation. This restores
    # full-pose IK without forcing the old fixed top-down orientation.
    pregrasp_offset_x_m: 0.0
    pregrasp_offset_y_m: 0.0
    pregrasp_offset_z_m: 0.05
    constrain_pregrasp_orientation: true

    # Preserve the live gripper orientation. Set this false only when a
    # deliberately configured fixed map-frame RPY approach is wanted.
    preserve_current_orientation: true
    pregrasp_roll_rad: 3.141592653589793
    pregrasp_pitch_rad: 0.0
    pregrasp_yaw_rad: 0.0
    position_tolerance_m: 0.02
    orientation_tolerance_rad: 0.15

    planning_time_sec: 5.0
    planning_attempts: 5
    velocity_scaling: 0.15
    acceleration_scaling: 0.10
